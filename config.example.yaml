# awtrix-bridge configuration. ${VARS} are expanded from the environment.
# This mirrors the current "AWTRIX - Update Apps" + "Bus Arrival Notification" automations.

homeassistant:
  url: ${HA_URL}          # e.g. http://homeassistant.local:8123
  token: ${HA_TOKEN}      # long-lived access token (Profile -> Security)

mqtt:
  broker: ${MQTT_BROKER}  # the broker HA's MQTT integration uses (TeslaMate mosquitto)
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  client_id: awtrix-bridge

awtrix:
  app_topic: awtrix/cmd/apps/pushed/{name}
  settings_topic: awtrix/cmd/settings
  sound_topic: awtrix/cmd/audio/play
  switch_topic: awtrix/cmd/apps/switch
  active_topic: awtrix/state/apps/active  # the clock reports the app on screen here
  clock_settings_topic: awtrix/state/settings  # the clock reports its settings here
  arm_topic: awtrix-bridge/{name}/armed   # retained on/off state of require_arm apps
  resync_interval: 5m     # re-push everything so the clock recovers after a reboot

brightness:
  quiet_entity: binary_sensor.heat_recovery_ventilation_quiet_time
  quiet: 1
  normal: 255

chime:                          # melody at every full hour; pick one in the admin UI
  melody: ding                  # tick | ding | dingdong | chirp | westminster | off
  # rtttl: "..."                # or a custom tune (used when melody is empty)
  quiet_entity: binary_sensor.heat_recovery_ventilation_quiet_time   # silent while on

timer:                          # optional: the timer started from the admin UI
  melody: beeps                 # played at the end; pick one in the admin UI, or off
  # icon: "1820"               # a LaMetric icon number; uploaded to the clock if missing
  # color: "#FFFFFF"            # text while running; done_color after the end
  # progress_color: "#FFFFFF"   # the bar on the bottom row (default: color)
  # track_color: "#303030"      # the bar's unfilled part
  # hold_after: 1m              # counts up this long after the end
  # switch_back: Time           # default: the app on screen when it started

apps:
  - name: radon
    type: value
    entity: sensor.radon_level
    icon: "2644"
    format: "Rn %.0f Bq"
    colors:                       # first match wins; entry without "below" is the fallback
      - { below: 100, color: "#00FF00" }
      - { below: 300, color: "#FFAA00" }
      - { color: "#FF2200" }

  - name: solar
    type: value
    entity: sensor.inverter_pv_power
    icon: "27283"
    format: "%.0fW"
    color: "#FFCC00"

  - name: load
    type: value
    entity: sensor.inverter_activepower_load_sys
    icon: "21520"
    format: "%.0fW"
    color: "#00AAFF"

  - name: surplus
    type: surplus
    production: sensor.inverter_pv_power
    consumption: sensor.inverter_activepower_load_sys
    icon: "27283"
    night_icon: "13345"           # used when PV production is 0
    positive_color: "#00FF00"
    negative_color: "#FF4400"

  - name: temp_out
    type: value
    entity: sensor.comfoairq_outside_temperature
    icon: "6401"
    format: "%.1f"
    color: "#00CCFF"

  - name: temp_in
    type: value
    entity: sensor.thermostat_current_temperature
    icon: "7112"
    format: "%.1f"
    color: "#FF8800"

  - name: bus333
    type: countdown
    entity: sensor.next_333_arrival
    icon: "11999"
    require_arm: true             # hidden until armed in the admin UI; disarms itself after the bus arrives
    show_within: 0s               # 0s = shown the whole time it is armed
    hold_after: 2m                # count up "+0:42" for 2 minutes after arrival
    alert_at: 5m                  # beep once when 5 minutes remain (once per arming)
    alert_melody: twotone         # built-in melody (see admin UI) or off; or set alert_rtttl
    switch_at: 10m                # jump to this app once when 10 minutes remain (0 = never)
    switch_back: Time             # ...and back to the clock when hold_after ends
    colors:                       # thresholds in minutes remaining
      - { below: 2, color: "#FF2200" }
      - { below: 6, color: "#FFAA00" }
      - { color: "#00FF00" }
