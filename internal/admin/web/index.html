<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clock">
<title>Clock</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- The page is built by js/main.js from the views in js/views.js. -->
<div class="shell">
  <aside class="side">
    <header class="topbar">
      <a class="brand" href="#/">
        <img class="mark" src="icon.svg" alt="" width="28" height="28">
        <span>Clock</span>
      </a>
      <div class="conn" id="conn"><span class="dot"></span><span class="conn-text">Connecting…</span></div>
    </header>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="views" id="views"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
